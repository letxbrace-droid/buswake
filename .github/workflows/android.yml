# Compile l'application Android (Kotlin + Jetpack Compose) et publie l'APK.
#
# Les machines GitHub ont le SDK Android préinstallé ; c'est ici que l'APK se
# construit. À chaque poussée sur main touchant android/ (ou à la demande),
# l'APK est publié dans la release « android-latest » : un lien de
# téléchargement stable à ouvrir depuis le téléphone.
name: Android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', 'functions/index.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Sans SDK, settings.gradle.kts ne déclarerait pas le module :app — et
      # le build passerait sans rien produire. On l'exige explicitement.
      - name: Vérifier le SDK Android
        run: |
          test -n "$ANDROID_HOME"
          echo "SDK Android : $ANDROID_HOME"

      - name: Tests du domaine (dont la concordance avec le serveur)
        run: ./gradlew --no-daemon :domaine:test

      # Les écrans rendus sur la JVM : on les regarde AVANT de publier.
      - name: Captures d'écran (Paparazzi)
        run: ./gradlew --no-daemon :app:recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: android/app/src/test/snapshots/images/

      # Les mêmes images sur une branche à part, lisibles en clair
      # (raw.githubusercontent.com) — sans toucher aux branches de travail.
      - name: Publier les captures (branche captures-android)
        run: |
          cd app/src/test/snapshots/images
          git init -q && git checkout -q -b captures-android
          git -c user.name=ci -c user.email=ci@kolektif add .
          git -c user.name=ci -c user.email=ci@kolektif commit -q -m "Captures ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures-android

      - name: Compiler l'APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk kolektif.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kolektif-apk
          path: android/kolektif.apk

      - name: Publier (release android-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest kolektif.apk \
            --title "KOLEKTIF Android — build ${GITHUB_RUN_NUMBER}" \
            --notes "APK de l'application Android (Kotlin + Jetpack Compose), compilé depuis ${GITHUB_SHA::7}. Ouvre ce lien sur ton téléphone, télécharge kolektif.apk et autorise l'installation depuis cette source." \
            --prerelease --target "$GITHUB_SHA"
